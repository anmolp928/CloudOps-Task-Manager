apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment
  namespace: cloudops

spec:

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: postgres:17

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: "21234068"

            - name: POSTGRES_DB
              value: cloudops_db

          resources:

            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"