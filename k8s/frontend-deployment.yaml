apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: cloudops

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: anmolp20/cloudops-frontend:latest

          command:
            [
              "npm",
              "run",
              "dev",
              "--",
              "--host",
              "0.0.0.0"
            ]

          ports:
            - containerPort: 5173

          resources:

            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:

            httpGet:
              path: /
              port: 5173

            initialDelaySeconds: 30
            periodSeconds: 10


          readinessProbe:

            httpGet:
              path: /
              port: 5173

            initialDelaySeconds: 10
            periodSeconds: 5