apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: anmolp20/cloudops-backend:latest

          ports:
            - containerPort: 5000

          env:

            - name: PORT
              value: "5000"

            - name: DB_HOST
              value: postgres-service

            - name: DB_USER
              value: postgres

            - name: DB_PASSWORD
              value: "21234068"

            - name: DB_NAME
              value: cloudops_db

            - name: DB_PORT
              value: "5432"

            - name: JWT_SECRET
              value: supersecretjwtkey