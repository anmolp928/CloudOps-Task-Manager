apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: cloudops

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: anmolp20/cloudops-backend:latest

          ports:
            - containerPort: 5000

          env:

            - name: PORT
              value: "5000"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudops-config
                  key: DB_HOST

            - name: DB_USER
              value: postgres

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudops-secret
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cloudops-config
                  key: DB_NAME

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudops-config
                  key: DB_PORT

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudops-secret
                  key: JWT_SECRET

          resources:

            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:

            httpGet:
              path: /
              port: 5000

            initialDelaySeconds: 30
            periodSeconds: 10


          readinessProbe:

            httpGet:
              path: /
              port: 5000

            initialDelaySeconds: 10
            periodSeconds: 5